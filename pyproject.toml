[project]
name = "info-snipe"
version = "0.1.0"
description = "Fetch de-duplicated news by genre/topic and country/region."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "feedparser>=6.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
info-snipe = "info_snipe.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["info_snipe*"]
